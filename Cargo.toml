[package]
name = "aki"
version = "0.1.0"
edition = "2024"
default-run = "aki-cli"

[lib]
name = "aki"
path = "src/lib.rs"

[[bin]]
name = "aki-cli"
path = "src/bin/cli/mod.rs"

[[bin]]
name = "scripts"
path = "src/bin/scripts/mod.rs"

[[bin]]
name = "test"
path = "src/bin/test.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
clap = { version = "4.6", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.23", features = ["v7", "serde"] }
reqwest = { version = "0.13", features = ["json", "query"] }
tokio = { version = "1.52", features = ["macros", "rt-multi-thread"] }
sanitize-filename = { version = "0.6.0" }
toml = { version = "1.1" }
anyhow = { version = "1.0" }
thiserror = { version = "2" }
sys-locale = { version = "0.3" }
fjall = { version = "3" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
